name: Offline research tests and stored-evidence audit

on:
  push:
    branches:
      - ci/run-shadow-research-regression-tests
      - audit/forward-tick-replay-shadow
      - research/strict-quote-economics-v190
      - research/freeze-exploratory-feasibility-gates
      - research/independent-confirmation-readiness-gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Pytest and SHADOW evidence reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full offline pytest suite
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short --disable-warnings 2>&1 | tee pytest-results.txt

      - name: Audit broker CSV checksums against companion provenance
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee provenance-hash-audit.txt
          import json, os
          from data_provenance import DataProvenanceAuditor, compute_file_sha256

          records = DataProvenanceAuditor.generate_manifest()
          failed = False
          for sym, rel_path, _cadence, prov_json in DataProvenanceAuditor.MARKET_SPECS:
              if sym not in records:
                  print("MISSING_MARKET", sym, rel_path, flush=True)
                  failed = True
                  continue
              rec = records[sym]
              meta = {}
              if os.path.isfile(prov_json):
                  with open(prov_json, encoding="utf-8") as stream:
                      meta = json.load(stream)
              actual = compute_file_sha256(rel_path)
              expected = meta.get("sha256_checksum")
              summary = {
                  "symbol": sym,
                  "integrity": rec["file_integrity_status"],
                  "lineage": rec["transformation_lineage_status"],
                  "source_authenticity": rec["source_authenticity_status"],
                  "sha256_computed": actual,
                  "sha256_companion": expected,
                  "checksum_matches": actual == expected,
              }
              print("PROVENANCE", json.dumps(summary, sort_keys=True), flush=True)
              if actual != expected:
                  if (rec["file_integrity_status"] != "FILE_INTEGRITY_FAILED"
                      or rec["source_authenticity_status"] != "SOURCE_AUTHENTICITY_UNVERIFIED"
                      or rec["is_eligible_for_authoritative_research"]):
                      failed = True
                  else:
                      print("EXPECTED_QUARANTINE", sym, flush=True)
              elif rec["file_integrity_status"] != "FILE_INTEGRITY_VERIFIED":
                  failed = True
          if failed:
              raise SystemExit("FAIL_OPEN_PROVENANCE_DETECTED: integrity labels do not match evidence")
          print("ALL_PROVENANCE_CLASSIFICATIONS_MATCH_ACTUAL_FILES", flush=True)
          PY

      - name: Reconcile stored SHADOW sessions (no network, no purchases)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee evidence-audit.txt
          import json
          import os
          import sqlite3
          from canonical_cohort_reconciler import CanonicalCohortReconciler

          databases = [
              "data/v183_forward_predictions.db",
              "data/v1831_acceptance_session.db",
          ]
          for path in databases:
              print("DATABASE", path, "exists=", os.path.isfile(path), flush=True)
              if not os.path.isfile(path):
                  continue
              with sqlite3.connect(path) as conn:
                  conn.row_factory = sqlite3.Row
                  sessions = conn.execute(
                      "SELECT session_id, COUNT(*) AS committed, "
                      "SUM(CASE WHEN outcome_status = 'OUTCOME_RESOLVED' THEN 1 ELSE 0 END) AS resolved, "
                      "SUM(CASE WHEN outcome_status != 'OUTCOME_RESOLVED' THEN 1 ELSE 0 END) AS unresolved, "
                      "SUM(CASE WHEN outcome_status != 'OUTCOME_RESOLVED' AND proposal_id IS NOT NULL THEN 1 ELSE 0 END) AS unresolved_quoted, "
                      "SUM(CASE WHEN proposal_id IS NOT NULL THEN 1 ELSE 0 END) AS quoted "
                      "FROM forward_observations GROUP BY session_id"
                  ).fetchall()
              reconciler = CanonicalCohortReconciler.from_db_path(path)
              try:
                  for session in sessions:
                      record = dict(session)
                      print("SESSION", json.dumps(record, sort_keys=True), flush=True)
                      assert record["committed"] == record["resolved"] + record["unresolved"]
                      authority = reconciler.reconcile_session_authoritative(record["session_id"])
                      print(
                          "STRICT_AUTHORITY",
                          json.dumps({"session_id": record["session_id"], "telemetry": authority["telemetry"]}, sort_keys=True),
                          flush=True,
                      )
                      assert authority["telemetry"]["total_committed"] == record["committed"]
              finally:
                  reconciler.close()
          print("OFFLINE_EVIDENCE_RECONCILIATION_COMPLETED", flush=True)
          PY

      - name: Independent tick-sequence replay of stored contracts
        if: always()
        shell: bash
        run: |
          python tools/replay_forward_evidence.py --db data/v183_forward_predictions.db --db data/v1831_acceptance_session.db --output forward-tick-replay-audit.json 2>&1 | tee tick-replay-results.txt

      - name: Independently calculate strict quote-level SHADOW economics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python tools/strict_quote_economics.py --db data/v183_forward_predictions.db --db data/v1831_acceptance_session.db --output strict-quote-economics.json 2>&1 | tee strict-quote-economics.log

      - name: Validate deterministic SHADOW pilot protocol
        if: always()
        run: |
          python freeze_shadow_pilot.py --output /tmp/shadow-pilot-manifest.json
          python freeze_shadow_pilot.py --output /tmp/shadow-pilot-manifest.json --verify

      - name: Assert confirmation draft remains unactivated
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.confirmation_readiness_gate import evaluate
          plan = json.loads(Path("research/confirmation_plan_DRAFT.json").read_text(encoding="utf-8"))
          verdict = evaluate(plan)
          assert verdict["ready"] is False, "Draft must NOT authorize confirmation"
          assert plan["status"] == "DRAFT_NOT_ACTIVATED"
          print("CONFIRMATION_NOT_AUTHORIZED", json.dumps(verdict, sort_keys=True))
          PY

      - name: Upload test and audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-research-validation
          path: |
            pytest-results.txt
            provenance-hash-audit.txt
            evidence-audit.txt
            forward-tick-replay-audit.json
            tick-replay-results.txt
            strict-quote-economics.json
            strict-quote-economics.log
          if-no-files-found: warn
